# The turbo-vision <-> plank glue, plus the csvedit plugin built on it. It
# targets wasm32-wasip1 (WASI makes Instant::now() work, which Turbo Vision
# needs). Native `cargo test --lib` runs the pure modules.
[workspace]

[package]
name = "plank-tv"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
description = "Turbo Vision <-> plank glue (key translation, cell painting, the plank RAM disk) plus the csvedit WASM frame plugin built on tv-extensions's CSV editor"
repository = "https://github.com/aovestdipaperino/plank-tv"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["csvedit"]
# The Extism exports in `frame.rs`: the csvedit plugin itself. Off, this
# crate is a library of plank glue only, so a second plugin can depend on it
# without its exports clashing with its own.
csvedit = []

[dependencies]
extism-pdk = "1"
# Glyph packing and the OpenParams JSON readers shared by plank's guests.
plank-guest-support = { git = "https://github.com/aovestdipaperino/plank-guest-support", rev = "058b7422b1082670828fb4167b241a2793c6d8f1" }
# Turbo Vision without its terminal (`default-features = false` drops the
# `native` feature: crossterm and arboard).
turbo-vision = { version = "4.0", default-features = false }
# The generic CSV table editor (Session, CsvDoc, Disk), key translation and
# the host-driven application pump.
tv-extensions = { version = "0.3", features = ["csv"] }

[profile.release]
opt-level = "s"
strip = true
