# A Turbo Vision CSV editor as a plank frame component. Its own workspace: it
# targets wasm32-wasip1 (WASI makes Instant::now() work, which Turbo Vision
# needs). Native `cargo test --lib` runs the pure modules.
[workspace]

[package]
name = "plank-csvedit"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
repository = "https://github.com/aovestdipaperino/plank-csvedit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1"
# Glyph packing and the OpenParams JSON readers shared by plank's guests.
plank-guest-support = { git = "https://github.com/aovestdipaperino/plank-guest-support", rev = "058b7422b1082670828fb4167b241a2793c6d8f1" }
# Turbo Vision without its terminal (`default-features = false` drops the
# `native` feature: crossterm and arboard). Pinned to the same core rev
# tv-extensions uses, so the two resolve to one turbo-vision.
turbo-vision = { git = "https://github.com/aovestdipaperino/turbo-vision-4-rust", rev = "eae2cc843ed9744f8d5ece9571d3c2bcbedf602d", default-features = false }
# HostBackend, pump and the separator Grid.
tv-extensions = { git = "https://github.com/aovestdipaperino/tv-extensions", rev = "1fe197d12300abbda3d55ef410855198c5e657b1" }

[profile.release]
opt-level = "s"
strip = true
